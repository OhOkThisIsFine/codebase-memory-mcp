name: PR1 Native Startup Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quiet:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: windows-2025
            msystem: CLANG64
            pkg: x86_64
          - os: windows-11-arm
            msystem: CLANGARM64
            pkg: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: ${{ matrix.msystem }}
          path-type: inherit
          install: >-
            mingw-w64-clang-${{ matrix.pkg }}-clang
            mingw-w64-clang-${{ matrix.pkg }}-compiler-rt
            mingw-w64-clang-${{ matrix.pkg }}-zlib
            mingw-w64-clang-${{ matrix.pkg }}-python3
            mingw-w64-clang-${{ matrix.pkg }}-ccache
            make
            git
      - name: Protected owned fixture root
        shell: pwsh
        run: |
          $root = & scripts/ci/new-protected-temp-root.ps1 -Prefix 'cbm-pr1-quiet-' -ProtectDir (Join-Path $env:GITHUB_WORKSPACE "build\c")
          "CBM_CI_TEMP_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Compare hidden owned startup with and without Job Object / process group
        shell: msys2 {0}
        run: |
          export TEMP="$(cygpath -m "$CBM_CI_TEMP_ROOT")" TMPDIR="$(cygpath -u "$CBM_CI_TEMP_ROOT")"
          export TMP="$TEMP"
          git rev-parse HEAD
          clang --version
          clang -std=c11 -Wall -Wextra -Werror tests/native-startup-probe.c -o build/c/native-startup-probe.exe
          build/c/native-startup-probe.exe
